name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compilar
        run: gradle :app:assembleDebug --no-daemon

      - name: Renomear APKs
        run: |
          cp app/build/outputs/apk/nav/debug/app-nav-debug.apk MeuPainel.apk
          cp app/build/outputs/apk/simples/debug/app-simples-debug.apk MeuPainel-Simples.apk

      - name: Publicar para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Meu Painel v${{ github.run_number }}
          body: Baixe pelo celular e instale. MeuPainel.apk = tela com mostrador; MeuPainel-Simples.apk = versão em grade (teste).
          files: |
            MeuPainel.apk
            MeuPainel-Simples.apk
